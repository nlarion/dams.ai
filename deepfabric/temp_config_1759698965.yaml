dataset_system_prompt: You are an expert in web development and online advertising.
  Generate realistic HTML, CSS, and JavaScript code snippets for training an ML ad
  detection classifier that analyzes HTML structure, CSS classes, and JavaScript ad
  network patterns.
domain: insurance
topic_tree:
  topic_prompt: HTML/CSS/JavaScript elements and structures for insurance web ad detection
    training. Focus on insurance-specific DOM patterns, CSS classes, and ad network
    code.
  topic_system_prompt: You are an expert in web development and insurance websites.
    Generate diverse topics covering both advertisement HTML/CSS/JavaScript patterns
    (ad containers, tracking scripts, ad network code) and regular web content structures
    specific to insurance websites.
  degree: 6
  depth: 4
  temperature: 0.8
  provider: openai
  model: gpt-4o
  save_as: ad_detection_topics.jsonl
data_engine:
  instructions: "\n\n\u2696\uFE0F BALANCE REQUIREMENT: Generate approximately 50%\
    \ advertisement examples and 50% non-advertisement examples. Vary between ads\
    \ and non-ads to maintain this ratio throughout generation.\n\U0001F3AF PRIMARY\
    \ GOAL: Generate realistic HTML, CSS, and JavaScript code for training ML models\
    \ to detect ads by analyzing HTML structure.\n\nGenerate a realistic HTML example\
    \ based on the given topic for insurance websites.\n\nIMPORTANT: Your response\
    \ MUST follow this format:\n\nGenerate realistic HTML/CSS/JavaScript snippets\
    \ that an ML model will analyze to detect ads.\n\n1. Provide ONE complete HTML\
    \ snippet with inline CSS styles or <style> tags and/or <script> tags if relevant\n\
    2. Include realistic CSS class names, IDs, and attributes that are commonly used\
    \ in insurance websites\n3. For ads: Include common ad network code (Google AdSense,\
    \ DoubleClick), tracking pixels, data attributes\n4. For non-ads: Include typical\
    \ website elements without promotional markup\n5. Enclose in ```html``` code blocks\n\
    6. After the HTML, clearly state: Classification: is_ad: [true or false]\n7. If\
    \ it's an ad (is_ad: true), also specify: Ad Type: [banner/sidebar/inline/sponsored/native]\n\
    \nDOMAIN-SPECIFIC PATTERNS FOR insurance:\n\nE-COMMERCE: Product cards, discount\
    \ banners, shopping cart promos, \"Buy Now\" CTAs, price highlights, limited-time\
    \ offers, product recommendations\nNEWS: Native ads disguised as articles, sponsored\
    \ content, sidebar story recommendations, \"Recommended for you\", newsletter\
    \ signups\nSOCIAL-MEDIA: Promoted posts, sponsored stories, feed advertisements,\
    \ \"Suggested for you\", boosted content, influencer partnerships\nGAMING: In-game\
    \ offers, battle pass promos, currency purchases, loot box ads, character unlocks,\
    \ seasonal events, \"Limited Edition\" items\nFINANCE: Investment offers, credit\
    \ card ads, loan promotions, trading platforms, insurance quotes, financial advisors,\
    \ \"Start Investing\" CTAs\nTRAVEL: Hotel deals, flight offers, vacation packages,\
    \ booking.com style ads, \"Book Now\" CTAs, destination promotions, travel insurance\n\
    HEALTHCARE: Medical services, insurance ads, wellness products, telemedicine promos,\
    \ prescription drug ads, health screening offers\nEDUCATION: Course promotions,\
    \ webinar ads, educational tools, certification programs, \"Enroll Now\" CTAs,\
    \ learning platform ads\nENTERTAINMENT: Streaming service ads, movie promotions,\
    \ event tickets, concert announcements, \"Watch Now\" CTAs, subscription offers\n\
    SPORTS: Merchandise, ticket sales, betting promotions, fantasy sports, team gear,\
    \ \"Get Tickets\" CTAs, sports streaming services\nAUTOMOTIVE: Car ads, dealership\
    \ promotions, auto parts, test drive CTAs, financing offers, trade-in promotions,\
    \ \"Schedule Service\" CTAs, vehicle comparisons\nREAL-ESTATE: Property listings,\
    \ mortgage ads, rental promotions, \"Schedule Tour\" CTAs, real estate agent ads,\
    \ home valuation tools, refinancing offers\nFOOD-DELIVERY: Restaurant promos,\
    \ meal kit ads, delivery service offers, \"Order Now\" CTAs, discount codes, subscription\
    \ plans, first-order deals\nFASHION: Clothing sales, seasonal collections, \"\
    Shop the Look\" CTAs, brand partnerships, influencer collaborations, style guides,\
    \ size charts\nBEAUTY-COSMETICS: Makeup tutorials, skincare routines, product\
    \ launches, \"Try Now\" CTAs, before/after photos, subscription boxes, beauty\
    \ tips\nHOME-FURNISHING: Furniture sales, room inspiration, \"Design Your Space\"\
    \ CTAs, seasonal collections, free shipping offers, virtual room planners\nELECTRONICS:\
    \ Gadget launches, tech deals, \"Pre-Order\" CTAs, product comparisons, trade-in\
    \ programs, warranty offers, bundle deals\nJOB-SEARCH: Featured job listings,\
    \ recruiter ads, resume services, \"Apply Now\" CTAs, career coaching, skill assessments,\
    \ salary tools\nDATING: Profile promotions, premium features, \"Upgrade Now\"\
    \ CTAs, success stories, match algorithms, subscription tiers, safety features\n\
    FITNESS-WELLNESS: Gym memberships, supplement ads, workout programs, \"Start Free\
    \ Trial\" CTAs, transformation photos, nutrition plans, fitness challenges\nPET-SUPPLIES:\
    \ Pet food ads, accessory promotions, vet services, \"Subscribe & Save\" CTAs,\
    \ product reviews, pet care tips, loyalty programs\nINSURANCE: Quote tools, coverage\
    \ comparisons, \"Get Quote\" CTAs, policy explanations, savings calculators, customer\
    \ testimonials, claim services\nSTREAMING: Free trial offers, content previews,\
    \ \"Watch Now\" CTAs, subscription tiers, exclusive content, device compatibility,\
    \ download options\nSOFTWARE-APPS: SaaS promotions, free trial CTAs, feature comparisons,\
    \ pricing plans, \"Sign Up\" CTAs, integration showcases, demo videos\nTELECOMMUNICATIONS:\
    \ Phone plan ads, internet packages, \"Switch & Save\" CTAs, coverage maps, device\
    \ deals, bundle offers, network comparisons\nPHARMA-MEDICATION: Drug ads, OTC\
    \ promotions, prescription savings, \"Ask Your Doctor\" CTAs, side effects, patient\
    \ testimonials, pharmacy services\nTOYS-HOBBIES: Toy launches, collectibles, \"\
    Pre-Order\" CTAs, age recommendations, hobby supplies, limited editions, gift\
    \ guides\nLEGAL-SERVICES: Law firm ads, consultation offers, \"Free Case Review\"\
    \ CTAs, practice areas, attorney profiles, legal tech tools, document services\n\
    EVENT-TICKETING: Concert promotions, sports tickets, \"Buy Tickets\" CTAs, presale\
    \ codes, seat maps, venue info, VIP packages\n\nFor advertisement examples (HTML/CSS/JavaScript),\
    \ create content that includes:\n- Common ad container classes (ad, advertisement,\
    \ sponsored, promo, ad-banner, sidebar-ad, etc.)\n- Inline CSS styles or <style>\
    \ blocks with ad-specific styling\n- Ad network placeholders (google-adsense,\
    \ doubleclick, adsbygoogle, etc.)\n- JavaScript ad loading code (<script> tags\
    \ for ad networks)\n- Promotional content with CTAs relevant to insurance\n- Tracking\
    \ attributes (data-ad-id, data-campaign, data-tracking, etc.)\n- Common ad dimensions\
    \ (300x250, 728x90, 160x600, 320x50)\n- Ad-specific div IDs (#ad-slot, #banner-ad,\
    \ #sponsored-content)\n- iframes for third-party ad content\n- Tracking pixels\
    \ and analytics code\n\nFor non-advertisement examples (HTML/CSS/JavaScript),\
    \ create content for:\n- Navigation menus (nav, menu, header classes) with standard\
    \ styling\n- Article content (article, post, content, main classes)\n- User comments\
    \ (comment, review, feedback classes)\n- Form elements (form, input, button, select)\
    \ with standard markup\n- Footer sections (footer, copyright, site-info)\n- Regular\
    \ images/videos (without promotional content or tracking)\n- Standard page elements\
    \ without ad network code or tracking pixels\n\nExample HTML format with CSS/JavaScript\
    \ (AD):\n```html\n<div class=\"ad-container\" id=\"ad-slot-728x90\" data-ad-id=\"\
    12345\" data-campaign=\"summer-sale\">\n  <style>\n    .ad-container { width:\
    \ 728px; height: 90px; border: 1px solid #ddd; }\n    .ad-content { padding: 10px;\
    \ background: #fff; }\n  </style>\n  <div class=\"ad-content\">\n    <img src=\"\
    banner.jpg\" alt=\"Sale\">\n    <a href=\"#\" class=\"cta-button\">Shop Now</a>\n\
    \  </div>\n  <script async src=\"https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js\"\
    ></script>\n  <ins class=\"adsbygoogle\" data-ad-client=\"ca-pub-123456\"></ins>\n\
    </div>\n```\nClassification: is_ad: true\nAd Type: banner\n\nExample HTML format\
    \ (NON-AD):\n```html\n<nav class=\"main-navigation\">\n  <ul class=\"nav-menu\"\
    >\n    <li><a href=\"/\">Home</a></li>\n    <li><a href=\"/about\">About</a></li>\n\
    \    <li><a href=\"/contact\">Contact</a></li>\n  </ul>\n</nav>\n```\nClassification:\
    \ is_ad: false\n"
  generation_system_prompt: You are an expert in insurance websites and ad content.
