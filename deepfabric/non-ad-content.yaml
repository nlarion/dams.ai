dataset_system_prompt: "You are an expert in web development. Generate realistic HTML/CSS for typical web content like blog posts, articles, navigation, documentation, and standard UI components."

# Domain configuration - focused on content-heavy sites
domain: "content-sites"

topic_tree:
  topic_prompt: "HTML structures for {DOMAIN} websites including: blog posts, tech articles, news content, documentation, navigation menus, headers, footers, forms, tables, and UI components."
  topic_system_prompt: "Generate diverse topics for web content: article layouts, blog structures, technical documentation, news articles, navigation patterns, and standard web UI elements."
  degree: 4
  depth: 3
  temperature: 0.9
  provider: "openai"
  model: "gpt-4o"
  save_as: "non_ad_topics.jsonl"

data_engine:
  instructions: |
    Generate realistic HTML content based on the topic. Choose from these categories:

    📰 NEWS/BLOG ARTICLES:
    - Article with headline, byline, date, content paragraphs
    - Blog post with author bio, tags, comments section
    - Tech tutorial with code snippets
    - News story with quotes and citations

    💻 TECHNICAL CONTENT:
    - Code documentation with syntax highlighting
    - API reference sections
    - README-style content
    - Tutorial steps with numbered lists
    - Technical specifications tables

    🧭 NAVIGATION & STRUCTURE:
    - Header with logo and nav menu
    - Footer with links and copyright
    - Breadcrumb navigation
    - Sidebar with categories
    - Search forms
    - Pagination controls

    📝 STANDARD ELEMENTS:
    - Contact forms
    - User comments/reviews (non-promotional)
    - FAQ sections
    - About us content
    - Tables with data
    - Image galleries (non-promotional)
    - Video embeds (non-ad content)

    🎨 UI COMPONENTS:
    - Cards with informational content
    - Accordions and tabs
    - Alerts and notifications
    - Modal dialogs
    - Tooltips and help text

    FORMAT:
    1. Provide ONE complete HTML snippet with CSS
    2. Use realistic, professional class names
    3. Include semantic HTML5 tags
    4. End with: Classification: is_ad: false

    Example:
    ```html
    <article class="blog-post">
      <header class="post-header">
        <h1>Understanding Python Decorators</h1>
        <div class="post-meta">
          <span class="author">By Jane Smith</span>
          <time datetime="2024-01-15">January 15, 2024</time>
        </div>
      </header>
      <div class="post-content">
        <p>Decorators are a powerful feature in Python that allow you to modify function behavior...</p>
      </div>
    </article>
    ```
    Classification: is_ad: false

  generation_system_prompt: "Generate typical web content like articles, documentation, navigation, and UI components. Standard HTML/CSS patterns you'd find on blogs, news sites, and documentation pages. Classify all as is_ad: false."
  provider: "openai"
  model: "gpt-4o"
  temperature: 0.9
  max_retries: 3

dataset:
  creation:
    num_steps: 5
    batch_size: 4
    provider: "openai"
    model: "gpt-4o"
    sys_msg: true
  save_as: "non_ad_dataset_raw.jsonl"
  format: "jsonl"

# Use the same formatter as ads
formatter:
  type: "custom"
  path: "./ad_detection_formatter.py"
  class_name: "AdDetectionFormatter"
  output_file: "non_ad_dataset.json"